name: foxtrot-db-operator-lab
services:
  management:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: operator
      POSTGRES_PASSWORD: ${LAB_ADMIN_PASSWORD:?Run scripts/lab.py up}
    ports: ["127.0.0.1:${LAB_MANAGEMENT_PORT}:5432"]
    volumes: [management:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d operator"]
      interval: 1s
      timeout: 3s
      retries: 30
  source:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_PASSWORD: ${LAB_ADMIN_PASSWORD}
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10, -c, cluster_name=operator-source]
    ports: ["127.0.0.1:${LAB_SOURCE_PORT}:5432"]
    volumes: [source:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d appdb"]
      interval: 1s
      timeout: 3s
      retries: 30
  target:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_PASSWORD: ${LAB_ADMIN_PASSWORD}
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10, -c, cluster_name=operator-target]
    ports: ["127.0.0.1:${LAB_TARGET_PORT}:5432"]
    volumes: [target:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d appdb"]
      interval: 1s
      timeout: 3s
      retries: 30
  pooler:
    build:
      context: .
      dockerfile: lab/Dockerfile.pgbouncer
    ports: ["127.0.0.1:${LAB_POOLER_PORT}:6432"]
    volumes: [./runtime/lab/pooler:/etc/pgbouncer:ro]
    depends_on:
      source: {condition: service_healthy}
      target: {condition: service_healthy}
volumes:
  management:
  source:
  target:
