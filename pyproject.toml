[project]
name = "db-migration-adaptor"
version = "0.2.0"
description = "Foxtrot PostgreSQL and PgBouncer migration operator"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "google-cloud-dms>=1.17,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.32,<1",
]

[project.scripts]
foxtrot-db = "db_operator.cli:main"
foxtrot-dms = "db_operator.dms:main"
foxtrot-db-runtime = "db_operator.runtime:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "httpx2>=2.16,<3",
    "ruff>=0.9,<1",
    "jsonschema>=4.23,<5",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_operator"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: isolated PostgreSQL/PgBouncer integration"]
